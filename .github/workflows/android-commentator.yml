name: Android Commentator APK

on:
  push:
    paths:
      - "android-commentator/**"
      - ".github/workflows/android-commentator.yml"
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-commentator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: commentator-debug-apk
          path: android-commentator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
